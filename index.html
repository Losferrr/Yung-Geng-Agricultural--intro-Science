<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>耘耕农科</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }
    html, body {
      height: 100%;
      overflow-y: scroll;
      scroll-behavior: smooth;
      background: #000;
    }
    .slide {
      height: 100vh;
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
    }
    .slide img {
      max-height: 100vh;
      width: auto;
      object-fit: contain;
      display: block;
    }
  </style>
</head>
<body>
  <div class="slide"><img src="images/slide_01.JPG" alt="slide 1"></div>
  <div class="slide"><img src="images/slide_02.JPG" alt="slide 2"></div>
  <div class="slide"><img src="images/slide_03.JPG" alt="slide 3"></div>
  <div class="slide"><img src="images/slide_04.JPG" alt="slide 4"></div>
  <div class="slide"><img src="images/slide_05.JPG" alt="slide 5"></div>
  <div class="slide"><img src="images/slide_06.JPG" alt="slide 6"></div>
  <div class="slide"><img src="images/slide_07.JPG" alt="slide 7"></div>
  <div class="slide"><img src="images/slide_08.JPG" alt="slide 8"></div>
  <div class="slide"><img src="images/slide_09.JPG" alt="slide 9"></div>
</body>
</html>
